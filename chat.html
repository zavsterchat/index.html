<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZavsterChat — Live Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A1F; color: #FFFFFF;
      min-height: 100vh; padding: 20px;
    }
    .header {
      display: flex; justify-content: space-between;
      align-items: center; max-width: 1200px;
      margin: 0 auto 20px;
    }
    .logo {
      font-size: 24px; font-weight: bold;
      background: linear-gradient(90deg, #7C3AED, #EC4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .status { font-size: 14px; color: #A1A1B5; }
    .video-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 20px; max-width: 1200px; margin: 0 auto;
    }
    .video-box {
      aspect-ratio: 4/3; background: #14142B;
      border-radius: 16px; display: flex;
      align-items: center; justify-content: center;
      flex-direction: column; border: 2px solid #2A2A45;
      position: relative; overflow: hidden;
    }
    .video-box video { width: 100%; height: 100%; object-fit: cover; }
    .video-label {
      position: absolute; top: 16px; left: 16px;
      background: rgba(0,0,0,0.6); padding: 6px 12px;
      border-radius: 20px; font-size: 13px; z-index: 2;
    }
    .video-placeholder {
      color: #6B6B80; font-size: 16px;
      text-align: center; padding: 20px;
    }
    .controls {
      display: flex; justify-content: center;
      gap: 16px; margin-top: 24px; flex-wrap: wrap;
    }
    .control-btn {
      padding: 14px 28px; font-size: 16px; font-weight: 600;
      color: white; background: #2A2A45; border: none;
      border-radius: 50px; cursor: pointer;
      transition: background 0.2s;
    }
    .control-btn:hover { background: #3A3A55; }
    .control-btn.primary {
      background: linear-gradient(90deg, #7C3AED, #EC4899);
    }
    .control-btn.danger { background: #EF4444; }
    @media (max-width: 768px) {
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">ZavsterChat</div>
    <div class="status" id="status">Ready to chat</div>
  </div>

  <div class="video-grid">
    <div class="video-box">
      <div class="video-label">🔵 You</div>
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="video-placeholder" id="localPlaceholder">Click "Start Camera" to begin</div>
    </div>
    <div class="video-box">
      <div class="video-label">🔴 Stranger</div>
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="video-placeholder" id="remotePlaceholder">Press "Start Chat" to find someone</div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn primary" id="startBtn">▶ Start Chat</button>
    <button class="control-btn" id="nextBtn">⏭ Next</button>
    <button class="control-btn danger" id="reportBtn">⚠ Report</button>
    <button class="control-btn" id="stopBtn">⏹ Stop</button>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const SIGNALING_URL = 'YOUR-RAILWAY-URL';

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const localPlaceholder = document.getElementById('localPlaceholder');
    const remotePlaceholder = document.getElementById('remotePlaceholder');
    const status = document.getElementById('status');

    let socket = null;
    let localStream = null;
    let peerConnection = null;
    let currentPartnerId = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    async function startCamera() {
      try {
        status.textContent = 'Requesting camera access...';
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true, audio: true
        });
        localVideo.srcObject = localStream;
        localPlaceholder.style.display = 'none';
        status.textContent = 'Camera is on. Click Start Chat to match.';
        return true;
      } catch (err) {
        status.textContent = 'Camera access denied';
        alert('Could not access camera. Please allow camera permission.');
        console.error(err);
        return false;
      }
    }

    function connectToServer() {
      if (socket && socket.connected) return;
      socket = io(SIGNALING_URL);

      socket.on('connect', () => {
        console.log('Connected to signaling server');
      });

      socket.on('waiting', () => {
        status.textContent = 'Waiting for a stranger...';
      });

      socket.on('partner-found', async ({ partnerId, initiator }) => {
        currentPartnerId = partnerId;
        status.textContent = 'Connected to a stranger';
        remotePlaceholder.style.display = 'none';

        createPeerConnection();

        // Add our local tracks
        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        // Only the initiator creates the offer
        if (initiator) {
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          socket.emit('signal', { to: partnerId, signal: { type: 'offer', sdp: offer.sdp }});
        }
      });

      socket.on('signal', async ({ from, signal }) => {
        if (!peerConnection) return;

        if (signal.type === 'offer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit('signal', { to: from, signal: { type: 'answer', sdp: answer.sdp }});
        } else if (signal.type === 'answer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
        } else if (signal.type === 'ice') {
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
          } catch (e) { console.warn('ICE error', e); }
        }
      });

      socket.on('partner-left', () => {
        status.textContent = 'Stranger disconnected. Click Next.';
        cleanupPeer();
      });
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (event) => {
        remoteVideo.srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && currentPartnerId) {
          socket.emit('signal', {
            to: currentPartnerId,
            signal: { type: 'ice', candidate: event.candidate }
          });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'disconnected' ||
            peerConnection.connectionState === 'failed') {
          status.textContent = 'Connection lost. Click Next.';
        }
      };
    }

    function cleanupPeer() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      remoteVideo.srcObject = null;
      remotePlaceholder.style.display = 'block';
      currentPartnerId = null;
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      if (!localStream) {
        const ok = await startCamera();
        if (!ok) return;
      }
      connectToServer();
      if (currentPartnerId) {
        socket.emit('leave-partner', { partnerId: currentPartnerId });
        cleanupPeer();
      }
      socket.emit('find-partner');
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (!socket || !localStream) return;
      if (currentPartnerId) {
        socket.emit('leave-partner', { partnerId: currentPartnerId });
        cleanupPeer();
      }
      status.textContent = 'Searching for someone...';
      socket.emit('find-partner');
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      if (socket && currentPartnerId) {
        socket.emit('leave-partner', { partnerId: currentPartnerId });
      }
      cleanupPeer();
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localVideo.srcObject = null;
        localPlaceholder.style.display = 'block';
        localStream = null;
      }
      status.textContent = 'Stopped';
    });

    document.getElementById('reportBtn').addEventListener('click', () => {
      if (currentPartnerId) {
        socket.emit('leave-partner', { partnerId: currentPartnerId });
        cleanupPeer();
      }
      status.textContent = 'Reported and disconnected';
      alert('Thank you. This user has been flagged for review.');
    });
  </script>
</body>
</html>
