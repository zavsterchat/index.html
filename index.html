<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZavsterChat — Meet. Chat. Connect.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A1F;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 600px; }
    h1 {
      font-size: 48px;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #7C3AED, #EC4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 18px;
      color: #A1A1B5;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #EF4444;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 24px;
    }
    .footer {
      margin-top: 60px;
      font-size: 13px;
      color: #6B6B80;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">18+ ONLY</div>
    <h1>ZavsterChat</h1>
    <p>Meet. Chat. Connect.<br>Real people. Real conversations. Coming soon.</p>
    <p style="font-size: 14px;">Built with care. Moderated 24/7. Free to start.</p>
    <div class="footer">© 2026 ZavsterChat</div>
  </div>
</body>
</html>
